name: Arch package

# Every push to main builds the Arch Linux package from
# packaging/arch/PKGBUILD and puts it on the "main-latest" pre-release,
# so a machine can install the latest main without building it:
#   scripts/install-arch-latest.sh
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arch-package
  cancel-in-progress: true

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # Pinned to the Arch Linux Archive of 2026-09-30 (Qt 6.11.2): miqt
      # v0.14.0's bindings do not compile against Qt 6.12, which made the
      # QAccessible*Interface classes non-copyable. Drop the pin when miqt
      # supports 6.12.
      - name: Build tools
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/30/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed base-devel github-cli go git pkgconf qt6-base
      - uses: actions/checkout@v4
      - name: Build the package (makepkg runs as a normal user)
        run: |
          useradd -m builder
          cp -r packaging/arch /home/builder/build
          chown -R builder /home/builder/build
          su builder -c 'cd /home/builder/build && makepkg -f --noconfirm'
          ls -l /home/builder/build/*.pkg.tar.zst
      - name: Publish as the main-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release delete main-latest --cleanup-tag --yes || true
          gh release create main-latest --prerelease --target "$GITHUB_SHA" \
            --title "Latest main (Arch package)" \
            --notes "Built from $GITHUB_SHA by the Arch package workflow. Install with scripts/install-arch-latest.sh." \
            /home/builder/build/recuerdo-git-r*.pkg.tar.zst
