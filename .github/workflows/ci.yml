name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Qt 5
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev build-essential pkg-config
      - name: Build, vet and test
        env:
          CGO_ENABLED: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          go build ./...
          go vet ./cmd/... ./internal/...
          go test ./...

  macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Qt 5
        run: |
          brew install qt@5 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build, vet and test
        env:
          CGO_ENABLED: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          go build ./...
          go vet ./cmd/... ./internal/...
          go test ./...

  windows:
    name: Test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      # MSYS2's UCRT64 toolchain with Qt 5, as miqt documents for native
      # Windows builds
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt5-base
      - name: Build, vet and test
        env:
          CGO_ENABLED: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          go version
          go build ./...
          go vet ./cmd/... ./internal/...
          go test ./...
